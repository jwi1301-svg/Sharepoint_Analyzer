<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SharePoint Version Analyzer</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div id="root"></div>
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <script type="text/babel">
    const { useState, useEffect } = React;

    const FileText = ({ className }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
      </svg>
    );

    const Trash2 = ({ className }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
      </svg>
    );

    const RefreshCw = ({ className }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
      </svg>
    );

    const Search = ({ className }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
    );

    const AlertCircle = ({ className }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    );

    const ChevronDown = ({ className }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 9l-7 7-7-7" />
      </svg>
    );

    const ChevronRight = ({ className }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" />
      </svg>
    );

    const Download = ({ className }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
      </svg>
    );

    const BarChart = ({ className }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
      </svg>
    );

    const Zap = ({ className }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 10V3L4 14h7v7l9-11h-7z" />
      </svg>
    );

    const InfoCircle = ({ className }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    );

    const SharePointVersionAnalyzer = () => {
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [accessToken, setAccessToken] = useState(null);
      const [userInfo, setUserInfo] = useState(null);
      const [siteUrl, setSiteUrl] = useState('');
      const [documents, setDocuments] = useState([]);
      const [filteredDocs, setFilteredDocs] = useState([]);
      const [loading, setLoading] = useState(false);
      const [loadingStatus, setLoadingStatus] = useState('');
      const [progressStats, setProgressStats] = useState({ current: 0, total: 0, found: 0 });
      const [searchTerm, setSearchTerm] = useState('');
      const [minVersions, setMinVersions] = useState(2);
      const [selectedDocs, setSelectedDocs] = useState(new Set());
      const [error, setError] = useState(null);
      const [expandedDocs, setExpandedDocs] = useState(new Set());
      const [selectedVersions, setSelectedVersions] = useState({});
      const [scanCache, setScanCache] = useState({});
      const [sortBy, setSortBy] = useState('versionCount');
      const [showDashboard, setShowDashboard] = useState(true);
      const [showEstimateInfo, setShowEstimateInfo] = useState(false);
      const [deletedVersionInfo, setDeletedVersionInfo] = useState({});

      // Sync scroll between top and bottom scrollbars
      useEffect(() => {
        const topScroll = document.getElementById('top-scroll');
        const bottomScroll = document.getElementById('bottom-scroll');
        
        if (topScroll && bottomScroll) {
          const syncScroll = (source, target) => {
            target.scrollLeft = source.scrollLeft;
          };
          
          const handleTopScroll = () => syncScroll(topScroll, bottomScroll);
          const handleBottomScroll = () => syncScroll(bottomScroll, topScroll);
          
          topScroll.addEventListener('scroll', handleTopScroll);
          bottomScroll.addEventListener('scroll', handleBottomScroll);
          
          return () => {
            topScroll.removeEventListener('scroll', handleTopScroll);
            bottomScroll.removeEventListener('scroll', handleBottomScroll);
          };
        }
      }, [filteredDocs]);

      const CLIENT_ID = 'b2412250-afe8-4ce4-b723-e463d309e2bd';
      const TENANT_ID = '2cc0500a-7eba-4d4c-abb5-944473559b47';
      const REDIRECT_URI = window.location.origin + window.location.pathname;
      const SCOPES = ['Sites.FullControl.All', 'Files.ReadWrite.All', 'User.Read'];

      const login = () => {
        const authUrl = `https://login.microsoftonline.com/${TENANT_ID}/oauth2/v2.0/authorize?` +
          `client_id=${CLIENT_ID}` +
          `&response_type=token` +
          `&redirect_uri=${encodeURIComponent(REDIRECT_URI)}` +
          `&scope=${encodeURIComponent(SCOPES.join(' '))}` +
          `&response_mode=fragment`;
        
        window.location.href = authUrl;
      };

      const logout = () => {
        setIsAuthenticated(false);
        setAccessToken(null);
        setUserInfo(null);
        setDocuments([]);
        setFilteredDocs([]);
        setScanCache({});
      };

      useEffect(() => {
        const hash = window.location.hash.substring(1);
        const params = new URLSearchParams(hash);
        const token = params.get('access_token');

        if (token) {
          setAccessToken(token);
          setIsAuthenticated(true);
          window.history.replaceState({}, document.title, window.location.pathname);
          fetchUserInfo(token);
        }
      }, []);

      const fetchUserInfo = async (token) => {
        try {
          const response = await fetch('https://graph.microsoft.com/v1.0/me', {
            headers: { Authorization: `Bearer ${token}` }
          });
          const data = await response.json();
          setUserInfo(data);
        } catch (err) {
          console.error('Error fetching user info:', err);
        }
      };

      const getStorageAnalytics = () => {
        const totalSize = documents.reduce((sum, doc) => sum + doc.size, 0);
        const totalVersions = documents.reduce((sum, doc) => sum + doc.versionCount, 0);
        const estimatedVersionSize = totalSize * 0.8;
        const avgVersionsPerDoc = documents.length > 0 ? totalVersions / documents.length : 0;
        
        const selectedSize = documents
          .filter(doc => selectedDocs.has(doc.id))
          .reduce((sum, doc) => sum + (doc.size * (doc.versionCount - 1) * 0.8), 0);

        const topWasters = [...documents]
          .map(doc => ({
            ...doc,
            estimatedVersionSpace: doc.size * (doc.versionCount - 1) * 0.8
          }))
          .sort((a, b) => b.estimatedVersionSpace - a.estimatedVersionSpace)
          .slice(0, 5);

        return {
          totalSize,
          totalVersions,
          estimatedVersionSize,
          avgVersionsPerDoc,
          selectedSize,
          topWasters,
          totalDocs: documents.length
        };
      };

      const analyzeSite = async (forceRefresh = false) => {
        if (!siteUrl.trim()) {
          setError('Please enter a SharePoint site URL');
          return;
        }

        if (!forceRefresh && scanCache[siteUrl]) {
          setDocuments(scanCache[siteUrl]);
          setFilteredDocs(scanCache[siteUrl]);
          return;
        }

        setLoading(true);
        setLoadingStatus('Connecting to SharePoint site...');
        setError(null);
        setDocuments([]);
        setProgressStats({ current: 0, total: 0, found: 0 });

        try {
          const url = new URL(siteUrl);
          const hostname = url.hostname;
          const sitePath = url.pathname;

          const siteResponse = await fetch(
            `https://graph.microsoft.com/v1.0/sites/${hostname}:${sitePath}`,
            { headers: { Authorization: `Bearer ${accessToken}` } }
          );

          if (!siteResponse.ok) throw new Error('Failed to access site. Check URL and permissions.');

          const siteData = await siteResponse.json();
          const siteId = siteData.id;

          setLoadingStatus('Fetching document libraries...');
          const drivesResponse = await fetch(
            `https://graph.microsoft.com/v1.0/sites/${siteId}/drives`,
            { headers: { Authorization: `Bearer ${accessToken}` } }
          );

          const drivesData = await drivesResponse.json();
          
          setProgressStats({ current: 0, total: drivesData.value.length, found: 0 });
          
          // Process drives in batches to avoid overwhelming SharePoint
          const batchSize = 4; // Process 4 libraries at a time
          const allDocs = [];
          
          for (let i = 0; i < drivesData.value.length; i += batchSize) {
            const batch = drivesData.value.slice(i, i + batchSize);
            const drivePromises = batch.map((drive, batchIndex) => 
              fetchDocumentsFromDriveParallel(siteId, drive.id, drive.name, i + batchIndex, drivesData.value.length)
            );
            
            const batchResults = await Promise.all(drivePromises);
            allDocs.push(...batchResults.flat());
            
            // Small delay between batches to give SharePoint breathing room
            if (i + batchSize < drivesData.value.length) {
              await new Promise(resolve => setTimeout(resolve, 800));
            }
          }

          const filteredForCache = allDocs.filter(doc => doc.versionCount >= 1);

          setDocuments(filteredForCache);
          setFilteredDocs(filteredForCache);
          setScanCache(prev => ({ ...prev, [siteUrl]: filteredForCache }));
          
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
          setLoadingStatus('');
          setProgressStats({ current: 0, total: 0, found: 0 });
        }
      };

      const fetchAllPages = async (initialUrl, headers) => {
        let allItems = [];
        let nextLink = initialUrl;

        while (nextLink) {
          const response = await fetch(nextLink, { headers });
          const data = await response.json();

          if (data.value) {
            allItems = allItems.concat(data.value);
          }

          nextLink = data['@odata.nextLink'] || null;
        }

        return allItems;
      };

      const fetchDocumentsRecursivelyParallel = async (driveId, itemId, libraryName, folderPath = '') => {
        try {
          const baseUrl = itemId
            ? `https://graph.microsoft.com/v1.0/drives/${driveId}/items/${itemId}/children?$expand=listItem($expand=versions)`
            : `https://graph.microsoft.com/v1.0/drives/${driveId}/root/children?$expand=listItem($expand=versions)`;

          const items = await fetchAllPages(baseUrl, { Authorization: `Bearer ${accessToken}` });

          let allDocs = [];
          const folderPromises = [];

          for (const item of items) {
            if (item.file) {
              const versionCount = item.listItem?.versions?.length || 1;
              if (versionCount >= minVersions) {
                allDocs.push({
                  id: item.id,
                  name: item.name,
                  path: item.webUrl,
                  folderPath: folderPath || '/',
                  library: libraryName,
                  size: item.size,
                  versionCount: versionCount,
                  versions: item.listItem?.versions || [],
                  driveId: driveId,
                  itemId: item.id
                });
                
                setProgressStats(prev => ({ ...prev, found: prev.found + 1 }));
              }
            } else if (item.folder) {
              const subFolderPath = folderPath ? `${folderPath}/${item.name}` : `/${item.name}`;
              folderPromises.push(
                fetchDocumentsRecursivelyParallel(driveId, item.id, libraryName, subFolderPath)
              );
            }
          }

          const subfolderResults = await Promise.all(folderPromises);
          allDocs = allDocs.concat(...subfolderResults);

          return allDocs;
        } catch (err) {
          console.error(`Error fetching from ${libraryName}${folderPath}:`, err);
          return [];
        }
      };

      const fetchDocumentsFromDriveParallel = async (siteId, driveId, libraryName, index, total) => {
        setLoadingStatus(`Scanning library ${index + 1}/${total}: ${libraryName}...`);
        const docs = await fetchDocumentsRecursivelyParallel(driveId, null, libraryName);
        setProgressStats(prev => ({ ...prev, current: prev.current + 1 }));
        return docs;
      };

      // Filter and sort documents
      useEffect(() => {
        let filtered = documents.filter(doc =>
          doc.versionCount >= minVersions &&
          (doc.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
           doc.library.toLowerCase().includes(searchTerm.toLowerCase()) ||
           (doc.folderPath && doc.folderPath.toLowerCase().includes(searchTerm.toLowerCase())))
        );

        filtered.sort((a, b) => {
          if (sortBy === 'versionCount') return b.versionCount - a.versionCount;
          if (sortBy === 'size') return b.size - a.size;
          if (sortBy === 'spaceImpact') {
            const aImpact = a.size * (a.versionCount - 1);
            const bImpact = b.size * (b.versionCount - 1);
            return bImpact - aImpact;
          }
          if (sortBy === 'name') return a.name.localeCompare(b.name);
          return 0;
        });

        setFilteredDocs(filtered);
      }, [searchTerm, minVersions, documents, sortBy]);

      const bulkSelectByVersions = (minVers) => {
        const toSelect = filteredDocs.filter(doc => doc.versionCount >= minVers).map(d => d.id);
        setSelectedDocs(new Set(toSelect));
      };

      const bulkSelectBySize = (minSizeMB) => {
        const minBytes = minSizeMB * 1024 * 1024;
        const toSelect = filteredDocs.filter(doc => doc.size >= minBytes).map(d => d.id);
        setSelectedDocs(new Set(toSelect));
      };

      const bulkSelectByAge = (monthsOld) => {
        const cutoffDate = new Date();
        cutoffDate.setMonth(cutoffDate.getMonth() - monthsOld);
        
        const toSelect = filteredDocs.filter(doc => {
          if (!doc.versions || doc.versions.length <= 1) return false;
          const oldestVersion = doc.versions[doc.versions.length - 1];
          const versionDate = new Date(oldestVersion.lastModifiedDateTime);
          return versionDate < cutoffDate;
        }).map(d => d.id);
        
        setSelectedDocs(new Set(toSelect));
      };

      const exportToCSV = () => {
        const analytics = getStorageAnalytics();
        
        let csv = 'SharePoint Version Analysis Report\n\n';
        csv += 'Summary Statistics\n';
        csv += `Total Documents,${analytics.totalDocs}\n`;
        csv += `Total Versions,${analytics.totalVersions}\n`;
        csv += `Average Versions per Document,${analytics.avgVersionsPerDoc.toFixed(2)}\n`;
        csv += `Total Size,${formatBytes(analytics.totalSize)}\n`;
        csv += `Estimated Version Storage,${formatBytes(analytics.estimatedVersionSize)}\n\n`;
        
        csv += 'Document Name,Library,Folder Path,Versions,Size,Estimated Version Space,Web URL\n';
        
        filteredDocs.forEach(doc => {
          const estimatedVersionSpace = doc.size * (doc.versionCount - 1) * 0.8;
          csv += `"${doc.name}","${doc.library}","${doc.folderPath}",${doc.versionCount},${doc.size},${estimatedVersionSpace},"${doc.path}"\n`;
        });

        const blob = new Blob([csv], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `sharepoint-version-analysis-${new Date().toISOString().split('T')[0]}.csv`;
        a.click();
        window.URL.revokeObjectURL(url);
      };

      const toggleSelection = (docId) => {
        const newSelected = new Set(selectedDocs);
        if (newSelected.has(docId)) {
          newSelected.delete(docId);
        } else {
          newSelected.add(docId);
        }
        setSelectedDocs(newSelected);
      };

      const selectAll = () => {
        setSelectedDocs(new Set(filteredDocs.map(d => d.id)));
      };

      const deselectAll = () => {
        setSelectedDocs(new Set());
      };

      const toggleExpand = (docId) => {
        const newExpanded = new Set(expandedDocs);
        if (newExpanded.has(docId)) {
          newExpanded.delete(docId);
        } else {
          newExpanded.add(docId);
        }
        setExpandedDocs(newExpanded);
      };

      const toggleVersionSelection = (docId, versionId) => {
        setSelectedVersions(prev => {
          const docVersions = new Set(prev[docId] || []);
          if (docVersions.has(versionId)) {
            docVersions.delete(versionId);
          } else {
            docVersions.add(versionId);
          }
          return { ...prev, [docId]: docVersions };
        });
      };

      const selectAllVersions = (docId) => {
        const doc = documents.find(d => d.id === docId);
        if (!doc || !doc.versions) return;
        const versionIds = doc.versions.slice(1).map(v => v.id);
        setSelectedVersions(prev => ({
          ...prev,
          [docId]: new Set(versionIds)
        }));
      };

      const deselectAllVersions = (docId) => {
        setSelectedVersions(prev => ({
          ...prev,
          [docId]: new Set()
        }));
      };

      const getTotalSelectedVersionsCount = () => {
        return Object.values(selectedVersions).reduce((total, versions) => total + versions.size, 0);
      };

      const deleteSelectedVersions = async (docId) => {
        const doc = documents.find(d => d.id === docId);
        const versionIds = selectedVersions[docId];

        if (!doc || !versionIds || versionIds.size === 0) return;

        if (!confirm(`Delete ${versionIds.size} selected version(s) for "${doc.name}"?`)) return;

        setLoading(true);
        let successCount = 0;

        try {
          for (const versionId of versionIds) {
            await fetch(
              `https://graph.microsoft.com/v1.0/drives/${doc.driveId}/items/${doc.itemId}/versions/${versionId}`,
              {
                method: 'DELETE',
                headers: { Authorization: `Bearer ${accessToken}` }
              }
            );
            successCount++;
          }
          alert(`Successfully deleted ${successCount} version(s)`);
          setSelectedVersions(prev => ({ ...prev, [docId]: new Set() }));
          
          // Track which versions were deleted for this document
          setDeletedVersionInfo(prev => ({
            ...prev,
            [docId]: {
              count: versionIds.size,
              timestamp: new Date().toLocaleTimeString()
            }
          }));
          
          // Update the document in state to reflect version deletion
          setDocuments(prevDocs => prevDocs.map(d => {
            if (d.id === docId) {
              const remainingVersions = d.versions.filter(v => !versionIds.has(v.id));
              return { ...d, versionCount: remainingVersions.length, versions: remainingVersions };
            }
            return d;
          }));
        } catch (err) {
          console.error(`Failed to delete versions for ${doc.name}:`, err);
          alert(`Error deleting versions. Deleted ${successCount} before error.`);
        } finally {
          setLoading(false);
        }
      };

      const deleteAllSelectedVersions = async () => {
        const totalVersions = getTotalSelectedVersionsCount();
        if (totalVersions === 0) return;

        if (!confirm(`Delete ${totalVersions} selected version(s)?`)) return;

        setLoading(true);
        let successCount = 0;

        try {
          for (const [docId, versionIds] of Object.entries(selectedVersions)) {
            if (versionIds.size === 0) continue;

            const doc = documents.find(d => d.id === docId);
            if (!doc) continue;

            for (const versionId of versionIds) {
              await fetch(
                `https://graph.microsoft.com/v1.0/drives/${doc.driveId}/items/${doc.itemId}/versions/${versionId}`,
                {
                  method: 'DELETE',
                  headers: { Authorization: `Bearer ${accessToken}` }
                }
              );
              successCount++;
            }
          }
          alert(`Successfully deleted ${successCount} version(s)`);
          setSelectedVersions({});
          
          // Track which versions were deleted for each document
          const deletionInfo = {};
          for (const [docId, versionIds] of Object.entries(selectedVersions)) {
            if (versionIds.size > 0) {
              deletionInfo[docId] = {
                count: versionIds.size,
                timestamp: new Date().toLocaleTimeString()
              };
            }
          }
          setDeletedVersionInfo(prev => ({ ...prev, ...deletionInfo }));
          
          // Update documents in state to reflect version deletion
          setDocuments(prevDocs => prevDocs.map(d => {
            const versionIds = selectedVersions[d.id];
            if (versionIds && versionIds.size > 0) {
              const remainingVersions = d.versions.filter(v => !versionIds.has(v.id));
              return { ...d, versionCount: remainingVersions.length, versions: remainingVersions };
            }
            return d;
          }));
        } catch (err) {
          console.error('Failed to delete versions:', err);
          alert(`Error deleting versions. Deleted ${successCount} before error.`);
        } finally {
          setLoading(false);
        }
      };

      const formatBytes = (bytes) => {
        if (bytes === 0) return '0 Bytes';
        const k = 1024;
        const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
      };

      const formatDate = (dateString) => {
        if (!dateString) return 'N/A';
        const date = new Date(dateString);
        return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      };

      if (!isAuthenticated) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center p-4">
            <div className="bg-white rounded-lg shadow-xl p-8 max-w-md w-full">
              <div className="text-center mb-6">
                <FileText className="w-16 h-16 text-blue-600 mx-auto mb-4" />
                <h1 className="text-3xl font-bold text-gray-800 mb-2">SharePoint Version Analyzer</h1>
                <p className="text-gray-600">Analyze and manage document version history</p>
              </div>
              
              <button
                onClick={login}
                className="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition-colors"
              >
                Sign in with Microsoft
              </button>
            </div>
          </div>
        );
      }

      const analytics = documents.length > 0 ? getStorageAnalytics() : null;

      return (
        <div className="min-h-screen bg-gray-50">
          <div className="bg-white shadow-sm border-b">
            <div className="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
              <div className="flex items-center gap-3">
                <FileText className="w-8 h-8 text-blue-600" />
                <h1 className="text-2xl font-bold text-gray-800">SharePoint Version Analyzer</h1>
              </div>
              <div className="flex items-center gap-4">
                <span className="text-sm text-gray-600">{userInfo?.displayName}</span>
                <button
                  onClick={logout}
                  className="text-sm text-blue-600 hover:text-blue-800"
                >
                  Sign Out
                </button>
              </div>
            </div>
          </div>

          <div className="max-w-7xl mx-auto px-4 py-6">
            <div className="bg-white rounded-lg shadow p-6 mb-6">
              <label className="block text-sm font-medium text-gray-700 mb-2">
                SharePoint Site URL
              </label>
              <div className="flex gap-2">
                <input
                  type="text"
                  value={siteUrl}
                  onChange={(e) => setSiteUrl(e.target.value)}
                  placeholder="https://yourtenant.sharepoint.com/sites/yoursite"
                  className="flex-1 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                />
                <button
                  onClick={() => analyzeSite(false)}
                  disabled={loading}
                  className="px-6 py-2 bg-blue-600 hover:bg-blue-700 disabled:bg-gray-400 text-white rounded-lg flex items-center gap-2 transition-colors"
                >
                  {loading ? <RefreshCw className="w-4 h-4 animate-spin" /> : <Search className="w-4 h-4" />}
                  Analyze
                </button>
                {scanCache[siteUrl] && !loading && (
                  <button
                    onClick={() => analyzeSite(true)}
                    className="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg flex items-center gap-2 transition-colors"
                    title="Refresh scan results"
                  >
                    <RefreshCw className="w-4 h-4" />
                  </button>
                )}
              </div>
              {error && (
                <div className="mt-3 text-red-600 text-sm flex items-center gap-2">
                  <AlertCircle className="w-4 h-4" />
                  {error}
                </div>
              )}
              {scanCache[siteUrl] && !loading && (
                <div className="mt-3 text-green-600 text-sm flex items-center gap-2">
                  <AlertCircle className="w-4 h-4" />
                  Using cached results. Click refresh to rescan.
                </div>
              )}
            </div>

            {analytics && analytics.topWasters.length > 0 && (
              <div className="bg-white rounded-lg shadow p-4 mb-6">
                <h3 className="font-medium text-gray-800 mb-3">Top 5 Space Wasters</h3>
                <div className="space-y-2">
                  {analytics.topWasters.map((doc, idx) => (
                    <div
                      key={doc.id}
                      className="flex items-center justify-between text-sm hover:bg-gray-50 p-2 rounded transition-colors"
                    >
                      <div className="flex-1 truncate">
                        <span className="text-gray-400 mr-2">{idx + 1}.</span>
                        <button
                          onClick={() => {
                            const element = document.getElementById(`doc-row-${doc.id}`);
                            if (element) {
                              element.scrollIntoView({ behavior: 'smooth', block: 'center' });
                              element.classList.add('bg-yellow-100');
                              setTimeout(() => {
                                element.classList.remove('bg-yellow-100');
                              }, 2000);
                            }
                          }}
                          className="text-blue-600 hover:text-blue-800 hover:underline cursor-pointer"
                        >
                          {doc.name}
                        </button>
                      </div>
                      <div className="flex items-center gap-4">
                        <span className="text-gray-600">{doc.versionCount} versions</span>
                        <span className="font-semibold text-orange-600">{formatBytes(doc.estimatedVersionSpace)}</span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {documents.length > 0 && (
              <>
                <div className="bg-white rounded-lg shadow p-6 mb-6">
                  <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
                    <div>
                      <label className="block text-sm font-medium text-gray-700 mb-2">
                        Search Documents
                      </label>
                      <input
                        type="text"
                        value={searchTerm}
                        onChange={(e) => setSearchTerm(e.target.value)}
                        placeholder="Search..."
                        className="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500"
                      />
                    </div>
                    
                    <div>
                      <label className="block text-sm font-medium text-gray-700 mb-2">
                        Min Versions
                      </label>
                      <input
                        type="number"
                        value={minVersions}
                        onChange={(e) => setMinVersions(Math.max(1, parseInt(e.target.value) || 1))}
                        min="1"
                        className="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500"
                      />
                    </div>

                    <div>
                      <label className="block text-sm font-medium text-gray-700 mb-2">
                        Sort By
                      </label>
                      <select
                        value={sortBy}
                        onChange={(e) => setSortBy(e.target.value)}
                        className="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500"
                      >
                        <option value="versionCount">Version Count</option>
                        <option value="size">File Size</option>
                        <option value="spaceImpact">Space Impact</option>
                        <option value="name">Name</option>
                      </select>
                    </div>

                    <div className="flex items-end gap-2">
                      <button
                        onClick={exportToCSV}
                        className="px-4 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg text-sm transition-colors flex items-center gap-2"
                      >
                        <Download className="w-4 h-4" />
                        Export
                      </button>
                    </div>
                  </div>

                  <div className="border-t pt-4">
                    <h3 className="text-sm font-medium text-gray-700 mb-3 flex items-center gap-2">
                      <Zap className="w-4 h-4" />
                      Bulk Select
                    </h3>
                    <div className="flex flex-wrap gap-2">
                      <button onClick={selectAll} className="px-3 py-1 text-xs bg-gray-100 hover:bg-gray-200 rounded">
                        All
                      </button>
                      <button onClick={deselectAll} className="px-3 py-1 text-xs bg-gray-100 hover:bg-gray-200 rounded">
                        None
                      </button>
                      <button onClick={() => bulkSelectByVersions(5)} className="px-3 py-1 text-xs bg-blue-100 hover:bg-blue-200 text-blue-800 rounded">
                        5+ Versions
                      </button>
                      <button onClick={() => bulkSelectByVersions(10)} className="px-3 py-1 text-xs bg-blue-100 hover:bg-blue-200 text-blue-800 rounded">
                        10+ Versions
                      </button>
                      <button onClick={() => bulkSelectBySize(50)} className="px-3 py-1 text-xs bg-purple-100 hover:bg-purple-200 text-purple-800 rounded">
                        50+ MB
                      </button>
                      <button onClick={() => bulkSelectBySize(100)} className="px-3 py-1 text-xs bg-purple-100 hover:bg-purple-200 text-purple-800 rounded">
                        100+ MB
                      </button>
                      <button onClick={() => bulkSelectByAge(6)} className="px-3 py-1 text-xs bg-orange-100 hover:bg-orange-200 text-orange-800 rounded">
                        Versions 6+ mo old
                      </button>
                      <button onClick={() => bulkSelectByAge(12)} className="px-3 py-1 text-xs bg-orange-100 hover:bg-orange-200 text-orange-800 rounded">
                        Versions 12+ mo old
                      </button>
                    </div>
                  </div>

                  <div className="flex justify-between items-center pt-4 border-t mt-4">
                    <div className="text-sm text-gray-600">
                      {selectedDocs.size} of {filteredDocs.length} selected
                      {getTotalSelectedVersionsCount() > 0 && (
                        <span className="ml-4 text-blue-600">
                          ({getTotalSelectedVersionsCount()} versions)
                        </span>
                      )}
                    </div>
                    <div className="flex gap-2">
                      {getTotalSelectedVersionsCount() > 0 && (
                        <button
                          onClick={deleteAllSelectedVersions}
                          disabled={loading}
                          className="px-4 py-2 bg-orange-600 hover:bg-orange-700 disabled:bg-gray-400 text-white rounded-lg text-sm flex items-center gap-2"
                        >
                          <Trash2 className="w-4 h-4" />
                          Delete {getTotalSelectedVersionsCount()} Selected Versions
                        </button>
                      )}
                    </div>
                  </div>
                </div>

                {analytics && (
                  <div className="mb-6">
                    <div className="flex justify-between items-center mb-3">
                      <h2 className="text-lg font-semibold text-gray-800 flex items-center gap-2">
                        <BarChart className="w-5 h-5" />
                        Storage Analytics Dashboard
                      </h2>
                      <button
                        onClick={() => setShowDashboard(!showDashboard)}
                        className="text-sm text-blue-600 hover:text-blue-800"
                      >
                        {showDashboard ? 'Hide' : 'Show'}
                      </button>
                    </div>

                    {showDashboard && (
                      <div className="bg-orange-50 border border-orange-300 rounded-lg p-4 mb-4">
                        <div className="flex items-start gap-2">
                          <AlertCircle className="w-5 h-5 text-orange-600 flex-shrink-0 mt-0.5" />
                          <div className="text-sm text-orange-900">
                            <strong className="text-orange-900">⚠️ Important - Version Deletion Warning:</strong>
                            <div className="mt-2 space-y-1">
                              <p>• Deleted versions are <strong>removed permanently</strong> and <strong>cannot be recovered</strong></p>
                              <p>• Versions <strong>do NOT go to the Recycle Bin</strong></p>
                              <p>• Storage space is <strong>reclaimed immediately</strong> (no 93-day wait)</p>
                              <p>• The current version of each document remains unchanged</p>
                              <p>• <strong>Use with caution</strong> - there is no undo</p>
                            </div>
                          </div>
                        </div>
                      </div>
                    )}

                    {showDashboard && (
                      <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
                        <div className="bg-white rounded-lg shadow p-4">
                          <div className="text-sm text-gray-600">Total Documents</div>
                          <div className="text-2xl font-bold text-gray-900">{analytics.totalDocs}</div>
                          <div className="text-xs text-gray-500 mt-1">{analytics.totalVersions} total versions</div>
                        </div>
                        <div className="bg-white rounded-lg shadow p-4">
                          <div className="text-sm text-gray-600">Avg Versions/Doc</div>
                          <div className="text-2xl font-bold text-gray-900">{analytics.avgVersionsPerDoc.toFixed(1)}</div>
                          <div className="text-xs text-gray-500 mt-1">per document</div>
                        </div>
                        <div className="bg-white rounded-lg shadow p-4">
                          <div className="text-sm text-gray-600 flex items-center gap-1">
                            Estimated Version Storage
                            <button
                              onClick={() => setShowEstimateInfo(!showEstimateInfo)}
                              className="text-blue-500 hover:text-blue-700"
                              title="Click for info about estimates"
                            >
                              <InfoCircle className="w-4 h-4" />
                            </button>
                          </div>
                          <div className="text-2xl font-bold text-orange-600">{formatBytes(analytics.estimatedVersionSize)}</div>
                          <div className="text-xs text-gray-500 mt-1">~80% of current size</div>
                        </div>
                        <div className="bg-white rounded-lg shadow p-4">
                          <div className="text-sm text-gray-600 flex items-center gap-1">
                            Selected Impact
                            <button
                              onClick={() => setShowEstimateInfo(!showEstimateInfo)}
                              className="text-blue-500 hover:text-blue-700"
                              title="Click for info about estimates"
                            >
                              <InfoCircle className="w-4 h-4" />
                            </button>
                          </div>
                          <div className="text-2xl font-bold text-green-600">{formatBytes(analytics.selectedSize)}</div>
                          <div className="text-xs text-gray-500 mt-1">potential space to reclaim</div>
                        </div>
                      </div>
                    )}

                    {showEstimateInfo && (
                      <div className="bg-blue-50 border-2 border-blue-300 rounded-lg p-4 mb-4">
                        <div className="flex items-start gap-3">
                          <InfoCircle className="w-6 h-6 text-blue-600 flex-shrink-0 mt-0.5" />
                          <div className="flex-1">
                            <h4 className="font-semibold text-blue-900 mb-2">About Storage Estimates</h4>
                            <div className="text-sm text-blue-800 space-y-2">
                              <p>
                                <strong>These are estimates</strong> because Microsoft doesn't provide actual version sizes through their API.
                              </p>
                              <p>
                                <strong>How we calculate:</strong> Current file size × (number of versions - 1) × 0.8
                              </p>
                              <p>
                                <strong>Why 80%?</strong> Versions are typically similar in size to the current file. We use 80% as a conservative estimate since older versions might be slightly smaller or larger depending on changes made.
                              </p>
                              <p>
                                <strong>Example:</strong> A 10MB file with 5 versions = 10MB × 4 × 0.8 = <strong>~32MB</strong> in version storage
                              </p>
                              <p className="text-blue-900 font-medium mt-3">
                                ⚠️ Actual space reclaimed may vary. This estimate helps prioritize which documents to clean up first.
                              </p>
                            </div>
                            <button
                              onClick={() => setShowEstimateInfo(false)}
                              className="mt-3 text-sm text-blue-600 hover:text-blue-800 font-medium"
                            >
                              Close
                            </button>
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                )}
              </>
            )}

            {filteredDocs.length > 0 && (
              <div className="bg-white rounded-lg shadow overflow-hidden">
                {/* Top scrollbar */}
                <div id="top-scroll" className="overflow-x-auto" style={{ overflowY: 'hidden', height: '20px' }}>
                  <div style={{ width: '2000px', height: '1px' }}></div>
                </div>
                
                {/* Main table with bottom scrollbar */}
                <div id="bottom-scroll" className="overflow-x-auto">
                  <table className="min-w-full divide-y divide-gray-200">
                  <thead className="bg-gray-50">
                    <tr>
                      <th className="px-3 py-3"></th>
                      <th className="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase">Select</th>
                      <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Document</th>
                      <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Library</th>
                      <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Folder</th>
                      <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Versions</th>
                      <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Size</th>
                      <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Est. Version Space</th>
                      <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Actions</th>
                    </tr>
                  </thead>
                  <tbody className="bg-white divide-y divide-gray-200">
                    {filteredDocs.map(doc => {
                      const estimatedVersionSpace = doc.size * (doc.versionCount - 1) * 0.8;
                      return (
                        <React.Fragment key={doc.id}>
                          <tr id={`doc-row-${doc.id}`} className={`hover:bg-gray-50 transition-colors duration-200 ${deletedVersionInfo[doc.id] ? 'bg-green-50' : ''}`}>
                            <td className="px-3 py-4">
                              <button
                                onClick={() => toggleExpand(doc.id)}
                                className="text-gray-500 hover:text-gray-700"
                              >
                                {expandedDocs.has(doc.id) ? (
                                  <ChevronDown className="w-5 h-5" />
                                ) : (
                                  <ChevronRight className="w-5 h-5" />
                                )}
                              </button>
                            </td>
                            <td className="px-3 py-4">
                              <input
                                type="checkbox"
                                checked={selectedDocs.has(doc.id)}
                                onChange={() => toggleSelection(doc.id)}
                                className="w-4 h-4 text-blue-600 rounded"
                              />
                            </td>
                            <td className="px-6 py-4 text-sm text-gray-900 font-medium">
                              {doc.name}
                              {deletedVersionInfo[doc.id] && (
                                <span className="ml-2 inline-flex px-2 py-0.5 text-xs font-medium rounded-full bg-green-100 text-green-800">
                                  ✓ Deleted {deletedVersionInfo[doc.id].count} version{deletedVersionInfo[doc.id].count > 1 ? 's' : ''} at {deletedVersionInfo[doc.id].timestamp}
                                </span>
                              )}
                            </td>
                            <td className="px-6 py-4 text-sm text-gray-600">{doc.library}</td>
                            <td className="px-6 py-4 text-sm text-gray-600">
                              <span className="font-mono text-xs">{doc.folderPath || '/'}</span>
                            </td>
                            <td className="px-6 py-4">
                              <span className={`inline-flex px-3 py-1 text-sm font-semibold rounded-full ${
                                doc.versionCount > 10 ? 'bg-red-100 text-red-800' :
                                doc.versionCount > 5 ? 'bg-yellow-100 text-yellow-800' :
                                'bg-green-100 text-green-800'
                              }`}>
                                {doc.versionCount}
                              </span>
                            </td>
                            <td className="px-6 py-4 text-sm text-gray-600">{formatBytes(doc.size)}</td>
                            <td className="px-6 py-4 text-sm font-semibold text-orange-600">{formatBytes(estimatedVersionSpace)}</td>
                            <td className="px-6 py-4">
                              <a href={doc.path} target="_blank" rel="noopener noreferrer" className="text-blue-600 hover:text-blue-800 text-sm">
                                View
                              </a>
                            </td>
                          </tr>
                          {expandedDocs.has(doc.id) && (
                            <tr>
                              <td colSpan="9" className="px-6 py-4 bg-gray-50">
                                <div className="border rounded-lg bg-white p-4">
                                  <div className="flex justify-between items-center mb-3">
                                    <h4 className="font-medium text-gray-800">Version History</h4>
                                    <div className="flex gap-2">
                                      <button onClick={() => selectAllVersions(doc.id)} className="px-3 py-1 text-xs bg-gray-100 hover:bg-gray-200 rounded" disabled={doc.versions.length <= 1}>
                                        Select All
                                      </button>
                                      <button onClick={() => deselectAllVersions(doc.id)} className="px-3 py-1 text-xs bg-gray-100 hover:bg-gray-200 rounded">
                                        Deselect All
                                      </button>
                                      <button onClick={() => deleteSelectedVersions(doc.id)} disabled={(selectedVersions[doc.id]?.size || 0) === 0 || loading} className="px-3 py-1 text-xs bg-red-600 hover:bg-red-700 disabled:bg-gray-300 text-white rounded flex items-center gap-1">
                                        <Trash2 className="w-3 h-3" />
                                        Delete ({selectedVersions[doc.id]?.size || 0})
                                      </button>
                                    </div>
                                  </div>
                                  {doc.versions.length > 0 ? (
                                    <table className="min-w-full text-sm">
                                      <thead className="bg-gray-100">
                                        <tr>
                                          <th className="px-3 py-2 text-left text-xs font-medium text-gray-500">Select</th>
                                          <th className="px-3 py-2 text-left text-xs font-medium text-gray-500">Version</th>
                                          <th className="px-3 py-2 text-left text-xs font-medium text-gray-500">Modified</th>
                                          <th className="px-3 py-2 text-left text-xs font-medium text-gray-500">Modified By</th>
                                          <th className="px-3 py-2 text-left text-xs font-medium text-gray-500">Status</th>
                                        </tr>
                                      </thead>
                                      <tbody className="divide-y divide-gray-200">
                                        {doc.versions.map((version, index) => (
                                          <tr key={version.id} className={index === 0 ? 'bg-blue-50' : 'hover:bg-gray-50'}>
                                            <td className="px-3 py-2">
                                              {index === 0 ? (
                                                <span className="text-xs text-gray-400">—</span>
                                              ) : (
                                                <input
                                                  type="checkbox"
                                                  checked={selectedVersions[doc.id]?.has(version.id) || false}
                                                  onChange={() => toggleVersionSelection(doc.id, version.id)}
                                                  className="w-4 h-4 text-blue-600 rounded"
                                                />
                                              )}
                                            </td>
                                            <td className="px-3 py-2 text-gray-700">{version.id}</td>
                                            <td className="px-3 py-2 text-gray-600">{formatDate(version.lastModifiedDateTime)}</td>
                                            <td className="px-3 py-2 text-gray-600">{version.lastModifiedBy?.user?.displayName || version.lastModifiedBy?.user?.email || 'Unknown'}</td>
                                            <td className="px-3 py-2">
                                              {index === 0 ? (
                                                <span className="inline-flex px-2 py-0.5 text-xs font-medium rounded-full bg-blue-100 text-blue-800">Current</span>
                                              ) : (
                                                <span className="inline-flex px-2 py-0.5 text-xs font-medium rounded-full bg-gray-100 text-gray-600">Previous</span>
                                              )}
                                            </td>
                                          </tr>
                                        ))}
                                      </tbody>
                                    </table>
                                  ) : (
                                    <p className="text-gray-500 text-sm">No version history available</p>
                                  )}
                                </div>
                              </td>
                            </tr>
                          )}
                        </React.Fragment>
                      );
                    })}
                  </tbody>
                </table>
              </div>
              </div>
            )}

            {loading && documents.length === 0 && (
              <div className="bg-white rounded-lg shadow p-12 text-center">
                <RefreshCw className="w-12 h-12 text-blue-600 animate-spin mx-auto mb-4" />
                <p className="text-gray-600 font-medium">{loadingStatus || 'Analyzing...'}</p>
                {progressStats.total > 0 && (
                  <div className="mt-4">
                    <div className="text-sm text-gray-500">
                      Libraries: {progressStats.current} / {progressStats.total}
                    </div>
                    <div className="text-sm text-blue-600 font-medium mt-1">
                      Found: {progressStats.found} documents
                    </div>
                    <div className="w-full bg-gray-200 rounded-full h-2 mt-3">
                      <div className="bg-blue-600 h-2 rounded-full transition-all" style={{ width: `${(progressStats.current / progressStats.total) * 100}%` }}></div>
                    </div>
                  </div>
                )}
              </div>
            )}

            {!loading && documents.length === 0 && siteUrl && (
              <div className="bg-white rounded-lg shadow p-12 text-center">
                <FileText className="w-12 h-12 text-gray-400 mx-auto mb-4" />
                <p className="text-gray-600">No documents with multiple versions found</p>
              </div>
            )}
          </div>
        </div>
      );
    };

    ReactDOM.render(<SharePointVersionAnalyzer />, document.getElementById('root'));
  </script>
</body>
</html>
