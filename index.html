<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SharePoint Version Analyzer</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div id="root"></div>
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <script type="text/babel">
    const { useState, useEffect } = React;

    // Lucide React icons as inline SVG components
    const FileText = ({ className }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
      </svg>
    );

    const Trash2 = ({ className }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
      </svg>
    );

    const RefreshCw = ({ className }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
      </svg>
    );

    const Search = ({ className }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
    );

    const AlertCircle = ({ className }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    );

    const ChevronDown = ({ className }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 9l-7 7-7-7" />
      </svg>
    );

    const ChevronRight = ({ className }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" />
      </svg>
    );

    const SharePointVersionAnalyzer = () => {
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [accessToken, setAccessToken] = useState(null);
      const [userInfo, setUserInfo] = useState(null);
      const [siteUrl, setSiteUrl] = useState('');
      const [documents, setDocuments] = useState([]);
      const [filteredDocs, setFilteredDocs] = useState([]);
      const [loading, setLoading] = useState(false);
      const [loadingStatus, setLoadingStatus] = useState('');
      const [progressStats, setProgressStats] = useState({ current: 0, total: 0, found: 0 });
      const [searchTerm, setSearchTerm] = useState('');
      const [minVersions, setMinVersions] = useState(2);
      const [selectedDocs, setSelectedDocs] = useState(new Set());
      const [error, setError] = useState(null);
      const [expandedDocs, setExpandedDocs] = useState(new Set());
      const [selectedVersions, setSelectedVersions] = useState({});
      const [scanCache, setScanCache] = useState({});

      // Azure AD Configuration
      const CLIENT_ID = 'b2412250-afe8-4ce4-b723-e463d309e2bd';
      const TENANT_ID = '2cc0500a-7eba-4d4c-abb5-944473559b47';
      const REDIRECT_URI = window.location.origin + window.location.pathname;
      const SCOPES = ['Sites.Read.All', 'Files.ReadWrite.All', 'User.Read'];

      // Microsoft Authentication
      const login = () => {
        const authUrl = `https://login.microsoftonline.com/${TENANT_ID}/oauth2/v2.0/authorize?` +
          `client_id=${CLIENT_ID}` +
          `&response_type=token` +
          `&redirect_uri=${encodeURIComponent(REDIRECT_URI)}` +
          `&scope=${encodeURIComponent(SCOPES.join(' '))}` +
          `&response_mode=fragment`;
        
        window.location.href = authUrl;
      };

      const logout = () => {
        setIsAuthenticated(false);
        setAccessToken(null);
        setUserInfo(null);
        setDocuments([]);
        setFilteredDocs([]);
        setScanCache({});
      };

      // Handle OAuth redirect
      useEffect(() => {
        const hash = window.location.hash.substring(1);
        const params = new URLSearchParams(hash);
        const token = params.get('access_token');

        if (token) {
          setAccessToken(token);
          setIsAuthenticated(true);
          window.history.replaceState({}, document.title, window.location.pathname);
          fetchUserInfo(token);
        }
      }, []);

      const fetchUserInfo = async (token) => {
        try {
          const response = await fetch('https://graph.microsoft.com/v1.0/me', {
            headers: { Authorization: `Bearer ${token}` }
          });
          const data = await response.json();
          setUserInfo(data);
        } catch (err) {
          console.error('Error fetching user info:', err);
        }
      };

      // Analyze SharePoint site with caching
      const analyzeSite = async (forceRefresh = false) => {
        if (!siteUrl.trim()) {
          setError('Please enter a SharePoint site URL');
          return;
        }

        // Check cache first
        if (!forceRefresh && scanCache[siteUrl]) {
          setDocuments(scanCache[siteUrl]);
          setFilteredDocs(scanCache[siteUrl]);
          return;
        }

        setLoading(true);
        setLoadingStatus('Connecting to SharePoint site...');
        setError(null);
        setDocuments([]);
        setProgressStats({ current: 0, total: 0, found: 0 });

        try {
          const url = new URL(siteUrl);
          const hostname = url.hostname;
          const sitePath = url.pathname;

          const siteResponse = await fetch(
            `https://graph.microsoft.com/v1.0/sites/${hostname}:${sitePath}`,
            { headers: { Authorization: `Bearer ${accessToken}` } }
          );

          if (!siteResponse.ok) throw new Error('Failed to access site. Check URL and permissions.');

          const siteData = await siteResponse.json();
          const siteId = siteData.id;

          setLoadingStatus('Fetching document libraries...');
          const drivesResponse = await fetch(
            `https://graph.microsoft.com/v1.0/sites/${siteId}/drives`,
            { headers: { Authorization: `Bearer ${accessToken}` } }
          );

          const drivesData = await drivesResponse.json();
          
          // PARALLEL PROCESSING: Process all drives concurrently
          setProgressStats({ current: 0, total: drivesData.value.length, found: 0 });
          
          const drivePromises = drivesData.value.map((drive, index) => 
            fetchDocumentsFromDriveParallel(siteId, drive.id, drive.name, index, drivesData.value.length)
          );

          const allDocsArrays = await Promise.all(drivePromises);
          const allDocs = allDocsArrays.flat();

          // Filter to only show documents with multiple versions (based on minVersions filter)
          const filteredForCache = allDocs.filter(doc => doc.versionCount >= 1);

          setDocuments(filteredForCache);
          setFilteredDocs(filteredForCache);
          
          // Cache the results
          setScanCache(prev => ({ ...prev, [siteUrl]: filteredForCache }));
          
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
          setLoadingStatus('');
          setProgressStats({ current: 0, total: 0, found: 0 });
        }
      };

      // Helper function to fetch all pages from a paginated API response
      const fetchAllPages = async (initialUrl, headers) => {
        let allItems = [];
        let nextLink = initialUrl;

        while (nextLink) {
          const response = await fetch(nextLink, { headers });
          const data = await response.json();

          if (data.value) {
            allItems = allItems.concat(data.value);
          }

          nextLink = data['@odata.nextLink'] || null;
        }

        return allItems;
      };

      // Recursively fetch all documents from a folder and its subfolders (PARALLEL VERSION)
      const fetchDocumentsRecursivelyParallel = async (driveId, itemId, libraryName, folderPath = '') => {
        try {
          const baseUrl = itemId
            ? `https://graph.microsoft.com/v1.0/drives/${driveId}/items/${itemId}/children?$expand=listItem($expand=versions)`
            : `https://graph.microsoft.com/v1.0/drives/${driveId}/root/children?$expand=listItem($expand=versions)`;

          const items = await fetchAllPages(baseUrl, { Authorization: `Bearer ${accessToken}` });

          let allDocs = [];
          const folderPromises = [];

          for (const item of items) {
            if (item.file) {
              // Filter at API level - only include if has multiple versions
              const versionCount = item.listItem?.versions?.length || 1;
              if (versionCount >= minVersions) {
                allDocs.push({
                  id: item.id,
                  name: item.name,
                  path: item.webUrl,
                  folderPath: folderPath || '/',
                  library: libraryName,
                  size: item.size,
                  versionCount: versionCount,
                  versions: item.listItem?.versions || [],
                  driveId: driveId,
                  itemId: item.id
                });
                
                // Update found count
                setProgressStats(prev => ({ ...prev, found: prev.found + 1 }));
              }
            } else if (item.folder) {
              // Process subfolders in parallel
              const subFolderPath = folderPath ? `${folderPath}/${item.name}` : `/${item.name}`;
              folderPromises.push(
                fetchDocumentsRecursivelyParallel(driveId, item.id, libraryName, subFolderPath)
              );
            }
          }

          // Wait for all subfolders to complete
          const subfolderResults = await Promise.all(folderPromises);
          allDocs = allDocs.concat(...subfolderResults);

          return allDocs;
        } catch (err) {
          console.error(`Error fetching from ${libraryName}${folderPath}:`, err);
          return [];
        }
      };

      const fetchDocumentsFromDriveParallel = async (siteId, driveId, libraryName, index, total) => {
        setLoadingStatus(`Scanning library ${index + 1}/${total}: ${libraryName}...`);
        const docs = await fetchDocumentsRecursivelyParallel(driveId, null, libraryName);
        setProgressStats(prev => ({ ...prev, current: prev.current + 1 }));
        return docs;
      };

      // Filter documents
      useEffect(() => {
        let filtered = documents.filter(doc =>
          doc.versionCount >= minVersions &&
          (doc.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
           doc.library.toLowerCase().includes(searchTerm.toLowerCase()) ||
           (doc.folderPath && doc.folderPath.toLowerCase().includes(searchTerm.toLowerCase())))
        );
        setFilteredDocs(filtered);
      }, [searchTerm, minVersions, documents]);

      // Selection handlers
      const toggleSelection = (docId) => {
        const newSelected = new Set(selectedDocs);
        if (newSelected.has(docId)) {
          newSelected.delete(docId);
        } else {
          newSelected.add(docId);
        }
        setSelectedDocs(newSelected);
      };

      const selectAll = () => {
        setSelectedDocs(new Set(filteredDocs.map(d => d.id)));
      };

      const deselectAll = () => {
        setSelectedDocs(new Set());
      };

      // Expand/collapse document version list
      const toggleExpand = (docId) => {
        const newExpanded = new Set(expandedDocs);
        if (newExpanded.has(docId)) {
          newExpanded.delete(docId);
        } else {
          newExpanded.add(docId);
        }
        setExpandedDocs(newExpanded);
      };

      // Version selection handlers
      const toggleVersionSelection = (docId, versionId) => {
        setSelectedVersions(prev => {
          const docVersions = new Set(prev[docId] || []);
          if (docVersions.has(versionId)) {
            docVersions.delete(versionId);
          } else {
            docVersions.add(versionId);
          }
          return { ...prev, [docId]: docVersions };
        });
      };

      const selectAllVersions = (docId) => {
        const doc = documents.find(d => d.id === docId);
        if (!doc || !doc.versions) return;
        const versionIds = doc.versions.slice(1).map(v => v.id);
        setSelectedVersions(prev => ({
          ...prev,
          [docId]: new Set(versionIds)
        }));
      };

      const deselectAllVersions = (docId) => {
        setSelectedVersions(prev => ({
          ...prev,
          [docId]: new Set()
        }));
      };

      // Get total selected versions count
      const getTotalSelectedVersionsCount = () => {
        return Object.values(selectedVersions).reduce((total, versions) => total + versions.size, 0);
      };

      // Delete versions
      const deleteVersions = async () => {
        if (selectedDocs.size === 0) return;

        if (!confirm(`Delete ALL version history for ${selectedDocs.size} document(s)? This will move versions to the SharePoint Recycle Bin.`)) return;

        setLoading(true);
        let successCount = 0;

        for (const docId of selectedDocs) {
          const doc = documents.find(d => d.id === docId);
          if (!doc) continue;

          try {
            for (const version of doc.versions.slice(1)) {
              await fetch(
                `https://graph.microsoft.com/v1.0/drives/${doc.driveId}/items/${doc.itemId}/versions/${version.id}`,
                {
                  method: 'DELETE',
                  headers: { Authorization: `Bearer ${accessToken}` }
                }
              );
            }
            successCount++;
          } catch (err) {
            console.error(`Failed to delete versions for ${doc.name}:`, err);
          }
        }

        alert(`Successfully deleted version history for ${successCount} document(s). Versions moved to Recycle Bin.`);
        setSelectedDocs(new Set());
        
        // Clear cache and refresh
        setScanCache(prev => {
          const newCache = { ...prev };
          delete newCache[siteUrl];
          return newCache;
        });
        analyzeSite(true);
        setLoading(false);
      };

      // Delete selected versions for a specific document
      const deleteSelectedVersions = async (docId) => {
        const doc = documents.find(d => d.id === docId);
        const versionIds = selectedVersions[docId];

        if (!doc || !versionIds || versionIds.size === 0) return;

        if (!confirm(`Delete ${versionIds.size} selected version(s) for "${doc.name}"? Versions will be moved to the SharePoint Recycle Bin.`)) return;

        setLoading(true);
        let successCount = 0;

        try {
          for (const versionId of versionIds) {
            await fetch(
              `https://graph.microsoft.com/v1.0/drives/${doc.driveId}/items/${doc.itemId}/versions/${versionId}`,
              {
                method: 'DELETE',
                headers: { Authorization: `Bearer ${accessToken}` }
              }
            );
            successCount++;
          }
          alert(`Successfully deleted ${successCount} version(s). Moved to Recycle Bin.`);
          setSelectedVersions(prev => ({ ...prev, [docId]: new Set() }));
          
          // Clear cache and refresh
          setScanCache(prev => {
            const newCache = { ...prev };
            delete newCache[siteUrl];
            return newCache;
          });
          analyzeSite(true);
        } catch (err) {
          console.error(`Failed to delete versions for ${doc.name}:`, err);
          alert(`Error deleting versions. Deleted ${successCount} before error.`);
        } finally {
          setLoading(false);
        }
      };

      // Delete all selected versions across all documents
      const deleteAllSelectedVersions = async () => {
        const totalVersions = getTotalSelectedVersionsCount();
        if (totalVersions === 0) return;

        if (!confirm(`Delete ${totalVersions} selected version(s) across all documents? Versions will be moved to the SharePoint Recycle Bin.`)) return;

        setLoading(true);
        let successCount = 0;

        try {
          for (const [docId, versionIds] of Object.entries(selectedVersions)) {
            if (versionIds.size === 0) continue;

            const doc = documents.find(d => d.id === docId);
            if (!doc) continue;

            for (const versionId of versionIds) {
              await fetch(
                `https://graph.microsoft.com/v1.0/drives/${doc.driveId}/items/${doc.itemId}/versions/${versionId}`,
                {
                  method: 'DELETE',
                  headers: { Authorization: `Bearer ${accessToken}` }
                }
              );
              successCount++;
            }
          }
          alert(`Successfully deleted ${successCount} version(s). Moved to Recycle Bin.`);
          setSelectedVersions({});
          
          // Clear cache and refresh
          setScanCache(prev => {
            const newCache = { ...prev };
            delete newCache[siteUrl];
            return newCache;
          });
          analyzeSite(true);
        } catch (err) {
          console.error('Failed to delete versions:', err);
          alert(`Error deleting versions. Deleted ${successCount} before error.`);
        } finally {
          setLoading(false);
        }
      };

      const formatBytes = (bytes) => {
        if (bytes === 0) return '0 Bytes';
        const k = 1024;
        const sizes = ['Bytes', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
      };

      const formatDate = (dateString) => {
        if (!dateString) return 'N/A';
        const date = new Date(dateString);
        return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      };

      // Login screen
      if (!isAuthenticated) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center p-4">
            <div className="bg-white rounded-lg shadow-xl p-8 max-w-md w-full">
              <div className="text-center mb-6">
                <FileText className="w-16 h-16 text-blue-600 mx-auto mb-4" />
                <h1 className="text-3xl font-bold text-gray-800 mb-2">SharePoint Version Analyzer</h1>
                <p className="text-gray-600">Analyze and manage document version history</p>
              </div>
              
              <button
                onClick={login}
                className="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition-colors"
              >
                Sign in with Microsoft
              </button>
            </div>
          </div>
        );
      }

      // Main app
      return (
        <div className="min-h-screen bg-gray-50">
          <div className="bg-white shadow-sm border-b">
            <div className="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
              <div className="flex items-center gap-3">
                <FileText className="w-8 h-8 text-blue-600" />
                <h1 className="text-2xl font-bold text-gray-800">SharePoint Version Analyzer</h1>
              </div>
              <div className="flex items-center gap-4">
                <span className="text-sm text-gray-600">{userInfo?.displayName}</span>
                <button
                  onClick={logout}
                  className="text-sm text-blue-600 hover:text-blue-800"
                >
                  Sign Out
                </button>
              </div>
            </div>
          </div>

          <div className="max-w-7xl mx-auto px-4 py-6">
            <div className="bg-white rounded-lg shadow p-6 mb-6">
              <label className="block text-sm font-medium text-gray-700 mb-2">
                SharePoint Site URL
              </label>
              <div className="flex gap-2">
                <input
                  type="text"
                  value={siteUrl}
                  onChange={(e) => setSiteUrl(e.target.value)}
                  placeholder="https://yourtenant.sharepoint.com/sites/yoursite"
                  className="flex-1 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                />
                <button
                  onClick={() => analyzeSite(false)}
                  disabled={loading}
                  className="px-6 py-2 bg-blue-600 hover:bg-blue-700 disabled:bg-gray-400 text-white rounded-lg flex items-center gap-2 transition-colors"
                >
                  {loading ? <RefreshCw className="w-4 h-4 animate-spin" /> : <Search className="w-4 h-4" />}
                  Analyze
                </button>
                {scanCache[siteUrl] && !loading && (
                  <button
                    onClick={() => analyzeSite(true)}
                    className="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg flex items-center gap-2 transition-colors"
                    title="Refresh scan results"
                  >
                    <RefreshCw className="w-4 h-4" />
                    Refresh
                  </button>
                )}
              </div>
              {error && (
                <div className="mt-3 text-red-600 text-sm flex items-center gap-2">
                  <AlertCircle className="w-4 h-4" />
                  {error}
                </div>
              )}
              {scanCache[siteUrl] && !loading && (
                <div className="mt-3 text-green-600 text-sm flex items-center gap-2">
                  <AlertCircle className="w-4 h-4" />
                  Using cached results. Click "Refresh" to rescan.
                </div>
              )}
            </div>

            {documents.length > 0 && (
              <div className="bg-white rounded-lg shadow p-6 mb-6">
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-2">
                      Search Documents
                    </label>
                    <input
                      type="text"
                      value={searchTerm}
                      onChange={(e) => setSearchTerm(e.target.value)}
                      placeholder="Search by name, library, or folder..."
                      className="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500"
                    />
                  </div>
                  
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-2">
                      Minimum Versions
                    </label>
                    <input
                      type="number"
                      value={minVersions}
                      onChange={(e) => setMinVersions(Math.max(1, parseInt(e.target.value) || 1))}
                      min="1"
                      className="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500"
                    />
                  </div>

                  <div className="flex items-end gap-2">
                    <button
                      onClick={selectAll}
                      className="px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-lg text-sm transition-colors"
                    >
                      Select All
                    </button>
                    <button
                      onClick={deselectAll}
                      className="px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-lg text-sm transition-colors"
                    >
                      Deselect All
                    </button>
                  </div>
                </div>

                <div className="flex justify-between items-center pt-4 border-t">
                  <div className="text-sm text-gray-600">
                    {selectedDocs.size} of {filteredDocs.length} documents selected
                    {getTotalSelectedVersionsCount() > 0 && (
                      <span className="ml-4 text-blue-600">
                        ({getTotalSelectedVersionsCount()} versions selected)
                      </span>
                    )}
                  </div>
                  <div className="flex gap-2">
                    {getTotalSelectedVersionsCount() > 0 && (
                      <button
                        onClick={deleteAllSelectedVersions}
                        disabled={loading}
                        className="px-6 py-2 bg-orange-600 hover:bg-orange-700 disabled:bg-gray-400 text-white rounded-lg flex items-center gap-2 transition-colors"
                      >
                        <Trash2 className="w-4 h-4" />
                        Delete {getTotalSelectedVersionsCount()} Selected Versions
                      </button>
                    )}
                    <button
                      onClick={deleteVersions}
                      disabled={selectedDocs.size === 0 || loading}
                      className="px-6 py-2 bg-red-600 hover:bg-red-700 disabled:bg-gray-400 text-white rounded-lg flex items-center gap-2 transition-colors"
                    >
                      <Trash2 className="w-4 h-4" />
                      Delete All Versions (Selected Docs)
                    </button>
                  </div>
                </div>
              </div>
            )}

            {filteredDocs.length > 0 && (
              <div className="bg-white rounded-lg shadow overflow-hidden">
                <table className="min-w-full divide-y divide-gray-200">
                  <thead className="bg-gray-50">
                    <tr>
                      <th className="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase">

                      </th>
                      <th className="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase">
                        Select
                      </th>
                      <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">
                        Document Name
                      </th>
                      <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">
                        Library
                      </th>
                      <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">
                        Folder
                      </th>
                      <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">
                        Versions
                      </th>
                      <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">
                        Size
                      </th>
                      <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">
                        Actions
                      </th>
                    </tr>
                  </thead>
                  <tbody className="bg-white divide-y divide-gray-200">
                    {filteredDocs.map(doc => (
                      <React.Fragment key={doc.id}>
                        <tr className="hover:bg-gray-50">
                          <td className="px-3 py-4">
                            <button
                              onClick={() => toggleExpand(doc.id)}
                              className="text-gray-500 hover:text-gray-700"
                              title={expandedDocs.has(doc.id) ? "Collapse versions" : "Expand versions"}
                            >
                              {expandedDocs.has(doc.id) ? (
                                <ChevronDown className="w-5 h-5" />
                              ) : (
                                <ChevronRight className="w-5 h-5" />
                              )}
                            </button>
                          </td>
                          <td className="px-3 py-4">
                            <input
                              type="checkbox"
                              checked={selectedDocs.has(doc.id)}
                              onChange={() => toggleSelection(doc.id)}
                              className="w-4 h-4 text-blue-600 rounded focus:ring-2 focus:ring-blue-500"
                            />
                          </td>
                          <td className="px-6 py-4 text-sm text-gray-900 font-medium">
                            {doc.name}
                          </td>
                          <td className="px-6 py-4 text-sm text-gray-600">
                            {doc.library}
                          </td>
                          <td className="px-6 py-4 text-sm text-gray-600">
                            <span className="font-mono text-xs" title={doc.folderPath}>
                              {doc.folderPath || '/'}
                            </span>
                          </td>
                          <td className="px-6 py-4">
                            <span className={`inline-flex px-3 py-1 text-sm font-semibold rounded-full ${
                              doc.versionCount > 10
                                ? 'bg-red-100 text-red-800'
                                : doc.versionCount > 5
                                ? 'bg-yellow-100 text-yellow-800'
                                : 'bg-green-100 text-green-800'
                            }`}>
                              {doc.versionCount}
                            </span>
                          </td>
                          <td className="px-6 py-4 text-sm text-gray-600">
                            {formatBytes(doc.size)}
                          </td>
                          <td className="px-6 py-4">
                            <a
                              href={doc.path}
                              target="_blank"
                              rel="noopener noreferrer"
                              className="text-blue-600 hover:text-blue-800 text-sm"
                            >
                              View
                            </a>
                          </td>
                        </tr>
                        {expandedDocs.has(doc.id) && (
                          <tr>
                            <td colSpan="8" className="px-6 py-4 bg-gray-50">
                              <div className="border rounded-lg bg-white p-4">
                                <div className="flex justify-between items-center mb-3">
                                  <h4 className="font-medium text-gray-800">Version History</h4>
                                  <div className="flex gap-2">
                                    <button
                                      onClick={() => selectAllVersions(doc.id)}
                                      className="px-3 py-1 text-xs bg-gray-100 hover:bg-gray-200 rounded transition-colors"
                                      disabled={doc.versions.length <= 1}
                                    >
                                      Select All
                                    </button>
                                    <button
                                      onClick={() => deselectAllVersions(doc.id)}
                                      className="px-3 py-1 text-xs bg-gray-100 hover:bg-gray-200 rounded transition-colors"
                                    >
                                      Deselect All
                                    </button>
                                    <button
                                      onClick={() => deleteSelectedVersions(doc.id)}
                                      disabled={(selectedVersions[doc.id]?.size || 0) === 0 || loading}
                                      className="px-3 py-1 text-xs bg-red-600 hover:bg-red-700 disabled:bg-gray-300 text-white rounded transition-colors flex items-center gap-1"
                                    >
                                      <Trash2 className="w-3 h-3" />
                                      Delete Selected ({selectedVersions[doc.id]?.size || 0})
                                    </button>
                                  </div>
                                </div>
                                {doc.versions.length > 0 ? (
                                  <table className="min-w-full text-sm">
                                    <thead className="bg-gray-100">
                                      <tr>
                                        <th className="px-3 py-2 text-left text-xs font-medium text-gray-500">Select</th>
                                        <th className="px-3 py-2 text-left text-xs font-medium text-gray-500">Version</th>
                                        <th className="px-3 py-2 text-left text-xs font-medium text-gray-500">Modified</th>
                                        <th className="px-3 py-2 text-left text-xs font-medium text-gray-500">Modified By</th>
                                        <th className="px-3 py-2 text-left text-xs font-medium text-gray-500">Status</th>
                                      </tr>
                                    </thead>
                                    <tbody className="divide-y divide-gray-200">
                                      {doc.versions.map((version, index) => (
                                        <tr key={version.id} className={index === 0 ? 'bg-blue-50' : 'hover:bg-gray-50'}>
                                          <td className="px-3 py-2">
                                            {index === 0 ? (
                                              <span className="text-xs text-gray-400" title="Cannot delete current version">—</span>
                                            ) : (
                                              <input
                                                type="checkbox"
                                                checked={selectedVersions[doc.id]?.has(version.id) || false}
                                                onChange={() => toggleVersionSelection(doc.id, version.id)}
                                                className="w-4 h-4 text-blue-600 rounded focus:ring-2 focus:ring-blue-500"
                                              />
                                            )}
                                          </td>
                                          <td className="px-3 py-2 text-gray-700">
                                            {version.id}
                                          </td>
                                          <td className="px-3 py-2 text-gray-600">
                                            {formatDate(version.lastModifiedDateTime)}
                                          </td>
                                          <td className="px-3 py-2 text-gray-600">
                                            {version.lastModifiedBy?.user?.displayName || version.lastModifiedBy?.user?.email || 'Unknown'}
                                          </td>
                                          <td className="px-3 py-2">
                                            {index === 0 ? (
                                              <span className="inline-flex px-2 py-0.5 text-xs font-medium rounded-full bg-blue-100 text-blue-800">
                                                Current
                                              </span>
                                            ) : (
                                              <span className="inline-flex px-2 py-0.5 text-xs font-medium rounded-full bg-gray-100 text-gray-600">
                                                Previous
                                              </span>
                                            )}
                                          </td>
                                        </tr>
                                      ))}
                                    </tbody>
                                  </table>
                                ) : (
                                  <p className="text-gray-500 text-sm">No version history available</p>
                                )}
                              </div>
                            </td>
                          </tr>
                        )}
                      </React.Fragment>
                    ))}
                  </tbody>
                </table>
              </div>
            )}

            {loading && documents.length === 0 && (
              <div className="bg-white rounded-lg shadow p-12 text-center">
                <RefreshCw className="w-12 h-12 text-blue-600 animate-spin mx-auto mb-4" />
                <p className="text-gray-600 font-medium">{loadingStatus || 'Analyzing SharePoint site...'}</p>
                {progressStats.total > 0 && (
                  <div className="mt-4">
                    <div className="text-sm text-gray-500">
                      Libraries scanned: {progressStats.current} / {progressStats.total}
                    </div>
                    <div className="text-sm text-blue-600 font-medium mt-1">
                      Documents with multiple versions found: {progressStats.found}
                    </div>
                    <div className="w-full bg-gray-200 rounded-full h-2 mt-3">
                      <div 
                        className="bg-blue-600 h-2 rounded-full transition-all duration-300"
                        style={{ width: `${(progressStats.current / progressStats.total) * 100}%` }}
                      ></div>
                    </div>
                  </div>
                )}
                <p className="text-gray-400 text-sm mt-4">Using parallel processing for faster scanning...</p>
              </div>
            )}

            {!loading && documents.length === 0 && siteUrl && (
              <div className="bg-white rounded-lg shadow p-12 text-center">
                <FileText className="w-12 h-12 text-gray-400 mx-auto mb-4" />
                <p className="text-gray-600">No documents with multiple versions found</p>
                <p className="text-gray-400 text-sm mt-2">Try lowering the minimum versions filter</p>
              </div>
            )}
          </div>
        </div>
      );
    };

    ReactDOM.render(<SharePointVersionAnalyzer />, document.getElementById('root'));
  </script>
</body>
</html>
